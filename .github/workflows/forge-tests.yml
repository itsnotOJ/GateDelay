name: Forge Tests

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths:
      - 'Contracts/**'
      - 'test/**'
      - 'foundry.toml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Contracts/**'
      - 'test/**'
      - 'foundry.toml'
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: default

jobs:
  # ─── Contracts/test/ suite (uses Contracts/foundry.toml) ─────────────────
  contracts-tests:
    name: Contracts/test/ suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry (pinned version)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.1.0"   # keep in sync with Contracts/foundry.toml [toolchain] forge

      - name: Show Forge version
        run: forge --version

      - name: Build Contracts
        run: forge build --contracts src/MarketCap.sol src/RoleManager.sol

      - name: List test suites (Contracts/test/)
        run: forge test --list --match-contract "MarketCapTest|RoleManagerTest"

      - name: Run Contracts/test/ tests
        run: |
          forge test --match-path test/MarketCap.t.sol --match-contract MarketCapTest -vvv
          forge test --match-path test/RoleManager.t.sol --match-contract RoleManagerTest -vvv
        env:
          FOUNDRY_PROFILE: ci

  # ─── root test/ suite (uses root foundry.toml) ───────────────────────────
  root-tests:
    name: root test/ suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry (pinned version)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.1.0"   # keep in sync with Contracts/foundry.toml [toolchain] forge

      - name: Show Forge version
        run: forge --version

      - name: Build (root profile)
        run: forge build --contracts Contracts/src/CircuitBreaker.sol

      - name: List test suites (root test/)
        run: forge test --list --match-contract CircuitBreakerTest

      - name: Run root test/ tests
        run: forge test --match-path test/CircuitBreaker.t.sol --match-contract CircuitBreakerTest -vvv
